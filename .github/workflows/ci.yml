name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Offline eval demo
        run: python -m evalkit.demo
      - name: Offline model comparison with run log
        run: python -m evalkit.runner replay:prompt_v1 replay:prompt_v2 --db runs/ci.sqlite
