name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest no longer ships Python 3.9, the oldest version the package supports
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Offline eval demo
        run: python -m evalkit.demo
      - name: Offline model comparison with run log
        run: python -m evalkit.runner replay:prompt_v1 replay:prompt_v2 --db runs/ci.sqlite
      - name: Offline guardrail suite
        run: python -m evalkit.guardrails replay:prompt_v1 replay:prompt_v2
      - name: Offline judge calibration
        run: python -m evalkit.judge
      - name: Regression gate against the committed baseline
        run: python -m evalkit.gate replay:prompt_v1
      - name: The gate still blocks a known regression
        run: |
          # keep the expected FAIL report out of the job summary
          if GITHUB_STEP_SUMMARY= python -m evalkit.gate replay:prompt_v2 > /dev/null; then
            echo "prompt_v2 should fail the gate"; exit 1
          fi
      - name: Build the eval dashboard
        run: python -m evalkit.dashboard --out runs/dashboard.html --json runs/dashboard.json
      - name: Attach the dashboard to the run
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: eval-dashboard
          path: runs/dashboard.*
