[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-evals"
version = "0.1.0"
description = "Eval and guardrail harness for an AI support feature: format, grounding and accuracy checks that run in CI."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["evalkit"]
